name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: install (site + server)
        run: npm ci --omit=dev

      - name: build the site and phone
        run: npm run build

      - name: paper wallet, curve, rug watch
        run: node scripts/wallet-test.mjs

      - name: install (desktop wallet deps, no electron binary)
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci --ignore-scripts

      - name: real-wallet guard and key handling (offline)
        run: node scripts/wallet-real-test.mjs --offline --no-electron
