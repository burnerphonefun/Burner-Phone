# Fly.io: one always-on machine (the server keeps the pump.fun stream and every phone's WebSocket open), with a disk for the day's rugs.
app = 'burnerphone'
primary_region = 'fra'

[build]

[env]
  PORT = '8787'
  DATA_DIR = '/data'
  DOWNLOAD_DIR = '/data/downloads'
  CANONICAL_HOST = 'burnerphone.fun'

[[mounts]]
  source = 'burner_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
